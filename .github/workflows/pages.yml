name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One in-flight deployment, and let it finish rather than cancelling it
# half-published.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The demo is gated on the same suites the benchmark is. Publishing five
      # apps that have not proved they do the same thing would undercut the one
      # claim the whole project rests on, and a broken demo is the version of
      # this repository most visitors would actually see.
      - name: Functional parity
        run: npm run test:e2e

      - name: Build site
        run: npm run build:site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
