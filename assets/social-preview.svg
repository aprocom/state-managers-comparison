<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">State Managers Comparison social preview</title>
  <desc id="desc">A restrained GitHub social preview for a React state manager comparison, showing measured main-thread CPU medians with confidence intervals and caveats.</desc>

  <defs>
    <style>
      .sans {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .mono {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", ui-monospace, monospace;
      }
      .title { font-size: 54px; font-weight: 720; letter-spacing: 0; fill: #f4f7fb; }
      .subtitle { font-size: 23px; font-weight: 430; letter-spacing: 0; fill: #b7c1cc; }
      .panel-title { font-size: 29px; font-weight: 700; letter-spacing: 0; fill: #f0f4f8; }
      .small { font-size: 17px; font-weight: 430; letter-spacing: 0; fill: #99a7b7; }
      .label { font-size: 23px; font-weight: 650; letter-spacing: 0; fill: #e4eaf1; }
      .value { font-size: 21px; font-weight: 650; letter-spacing: 0; fill: #f4f7fb; }
      .axis { font-size: 15px; font-weight: 500; letter-spacing: 0; fill: #7d8b9a; }
      .note { font-size: 16px; font-weight: 430; letter-spacing: 0; fill: #a9b5c2; }
      .chip { font-size: 16px; font-weight: 650; letter-spacing: 0; fill: #d7dee7; }
    </style>
  </defs>

  <!-- Layout constants used by the chart below:
       canvas 1280x640
       card: x=64 y=206 w=1152 h=340
       labelX=96, plotX=324, plotWidth=560, vMax=90
       valueX=914, markerX=982, annotationX=1004
       rowTop=306, rowHeight=39, barHeight=16
       x(v) = plotX + plotWidth * v / vMax
       barWidth(v) = plotWidth * v / vMax -->

  <rect width="1280" height="640" fill="#0b0f14"/>
  <rect x="40" y="40" width="1200" height="560" rx="8" fill="none" stroke="#18212b"/>

  <text x="64" y="82" class="sans title">State Managers Comparison</text>
  <text x="66" y="122" class="sans subtitle">One React trading app built five times. Only the state layer differs. Measured with the limits reported.</text>

  <g transform="translate(64 150)">
    <rect x="0" y="0" width="154" height="34" rx="4" fill="#111820" stroke="#2b3642"/>
    <text x="14" y="23" class="sans chip">RxJS</text>

    <rect x="168" y="0" width="154" height="34" rx="4" fill="#111820" stroke="#2b3642"/>
    <text x="182" y="23" class="sans chip">Redux Toolkit</text>

    <rect x="336" y="0" width="154" height="34" rx="4" fill="#111820" stroke="#2b3642"/>
    <text x="350" y="23" class="sans chip">MobX</text>

    <rect x="504" y="0" width="154" height="34" rx="4" fill="#111820" stroke="#2b3642"/>
    <text x="518" y="23" class="sans chip">Zustand</text>

    <rect x="672" y="0" width="154" height="34" rx="4" fill="#111820" stroke="#2b3642"/>
    <text x="686" y="23" class="sans chip">Jotai</text>
  </g>

  <g id="chart-card">
    <rect x="64" y="206" width="1152" height="340" rx="6" fill="#0f151c" stroke="#2a3542"/>
    <text x="96" y="252" class="sans panel-title">Main-thread CPU at 1000 updates/sec</text>
    <text x="96" y="280" class="sans small">Median ScriptDuration ms/s, unthrottled Chromium. Error bars show 95% bootstrap CIs.</text>

    <g id="grid" stroke="#25303a" stroke-width="1">
      <line data-tick="0" x1="324" y1="300" x2="324" y2="500"/>
      <line data-tick="30" x1="510.67" y1="300" x2="510.67" y2="500"/>
      <line data-tick="60" x1="697.33" y1="300" x2="697.33" y2="500"/>
      <line data-tick="90" x1="884" y1="300" x2="884" y2="500"/>
    </g>

    <line x1="324" y1="506" x2="884" y2="506" stroke="#33404d" stroke-width="1"/>
    <text x="324" y="528" text-anchor="middle" class="mono axis">0</text>
    <text x="510.67" y="528" text-anchor="middle" class="mono axis">30</text>
    <text x="697.33" y="528" text-anchor="middle" class="mono axis">60</text>
    <text x="884" y="528" text-anchor="middle" class="mono axis">90 ms/s</text>

    <!-- Rows are in README/library order, not sorted by median. -->
    <g id="rows">
      <!-- RxJS: median 38.5, CI 36.0-38.9, not separated from MobX. -->
      <text x="96" y="329" class="sans label">RxJS</text>
      <rect data-role="bar" data-name="RxJS" data-value="38.5" x="324" y="311" width="239.56" height="16" rx="3" fill="#728091"/>
      <line data-role="ci" data-name="RxJS" data-low="36.0" data-high="38.9" x1="548" y1="319" x2="566.04" y2="319" stroke="#d9e2ec" stroke-width="2"/>
      <line x1="548" y1="313" x2="548" y2="325" stroke="#d9e2ec" stroke-width="2"/>
      <line x1="566.04" y1="313" x2="566.04" y2="325" stroke="#d9e2ec" stroke-width="2"/>
      <text x="914" y="329" class="mono value">38.5</text>
      <circle cx="982" cy="319" r="5.5" fill="none" stroke="#b7c1cc" stroke-width="2"/>
      <text x="1004" y="329" class="sans note">not separated from reference</text>

      <!-- Redux Toolkit: median 70.4, CI 65.9-78.6, p=0.0039 vs MobX. -->
      <text x="96" y="368" class="sans label">Redux Toolkit</text>
      <rect data-role="bar" data-name="Redux Toolkit" data-value="70.4" x="324" y="350" width="438.04" height="16" rx="3" fill="#728091"/>
      <line data-role="ci" data-name="Redux Toolkit" data-low="65.9" data-high="78.6" x1="734.04" y1="358" x2="813.07" y2="358" stroke="#d9e2ec" stroke-width="2"/>
      <line x1="734.04" y1="352" x2="734.04" y2="364" stroke="#d9e2ec" stroke-width="2"/>
      <line x1="813.07" y1="352" x2="813.07" y2="364" stroke="#d9e2ec" stroke-width="2"/>
      <text x="914" y="368" class="mono value">70.4</text>
      <circle cx="982" cy="358" r="5.5" fill="#d2b46d"/>
      <text x="1004" y="368" class="sans note">p=0.0039 vs reference</text>

      <!-- MobX: median 29.8, CI 27.7-31.7, reference. -->
      <text x="96" y="407" class="sans label">MobX</text>
      <rect data-role="bar" data-name="MobX" data-value="29.8" x="324" y="389" width="185.42" height="16" rx="3" fill="#728091"/>
      <line data-role="ci" data-name="MobX" data-low="27.7" data-high="31.7" x1="496.36" y1="397" x2="521.24" y2="397" stroke="#d9e2ec" stroke-width="2"/>
      <line x1="496.36" y1="391" x2="496.36" y2="403" stroke="#d9e2ec" stroke-width="2"/>
      <line x1="521.24" y1="391" x2="521.24" y2="403" stroke="#d9e2ec" stroke-width="2"/>
      <text x="914" y="407" class="mono value">29.8</text>
      <path d="M976.5 397H987.5M982 391.5V402.5" stroke="#d2b46d" stroke-width="2"/>
      <text x="1004" y="407" class="sans note">lowest median; reference only</text>

      <!-- Zustand: median 65.3, CI 62.4-69.9, p=0.0039 vs MobX. -->
      <text x="96" y="446" class="sans label">Zustand</text>
      <rect data-role="bar" data-name="Zustand" data-value="65.3" x="324" y="428" width="406.31" height="16" rx="3" fill="#728091"/>
      <line data-role="ci" data-name="Zustand" data-low="62.4" data-high="69.9" x1="712.27" y1="436" x2="758.93" y2="436" stroke="#d9e2ec" stroke-width="2"/>
      <line x1="712.27" y1="430" x2="712.27" y2="442" stroke="#d9e2ec" stroke-width="2"/>
      <line x1="758.93" y1="430" x2="758.93" y2="442" stroke="#d9e2ec" stroke-width="2"/>
      <text x="914" y="446" class="mono value">65.3</text>
      <circle cx="982" cy="436" r="5.5" fill="#d2b46d"/>
      <text x="1004" y="446" class="sans note">p=0.0039 vs reference</text>

      <!-- Jotai: median 83.7, CI 70.4-86.9, p=0.0039 vs MobX. -->
      <text x="96" y="485" class="sans label">Jotai</text>
      <rect data-role="bar" data-name="Jotai" data-value="83.7" x="324" y="467" width="520.80" height="16" rx="3" fill="#728091"/>
      <line data-role="ci" data-name="Jotai" data-low="70.4" data-high="86.9" x1="762.04" y1="475" x2="864.76" y2="475" stroke="#d9e2ec" stroke-width="2"/>
      <line x1="762.04" y1="469" x2="762.04" y2="481" stroke="#d9e2ec" stroke-width="2"/>
      <line x1="864.76" y1="469" x2="864.76" y2="481" stroke="#d9e2ec" stroke-width="2"/>
      <text x="914" y="485" class="mono value">83.7</text>
      <circle cx="982" cy="475" r="5.5" fill="#d2b46d"/>
      <text x="1004" y="485" class="sans note">p=0.0039 vs reference</text>
    </g>
  </g>

  <g id="legend">
    <line x1="64" y1="568" x2="1216" y2="568" stroke="#202a34" stroke-width="1"/>
    <circle cx="76" cy="596" r="5.5" fill="none" stroke="#b7c1cc" stroke-width="2"/>
    <text x="96" y="602" class="sans note">not separated after Holm correction</text>
    <circle cx="376" cy="596" r="5.5" fill="#d2b46d"/>
    <text x="396" y="602" class="sans note">separated from reference only</text>
    <text x="668" y="602" class="sans note">This is a grouping signal, not a five-place ranking.</text>
  </g>
</svg>
